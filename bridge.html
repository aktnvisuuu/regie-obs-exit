<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pilote Spotify EXIT</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden}
#s{display:none;font:600 13px/1.4 -apple-system,system-ui,sans-serif;color:#2BE07F;background:rgba(0,0,0,.75);padding:6px 10px;border-radius:8px;position:fixed;left:8px;top:8px;max-width:90vw}
</style>
</head>
<body>
<div id="s"></div>
<script>
'use strict';
/* =====================================================================
   Pilote Spotify → OBS (Régie EXIT)
   Tourne dans une source navigateur d'OBS. Lit la lecture Spotify et
   affiche la vidéo du morceau en cours dans la scène SONS, calée sur
   la position du morceau. Pause → vidéo en pause et masquée.
   Tout est passé dans le # de l'adresse (jamais envoyé à GitHub).
   ===================================================================== */
const P=new URLSearchParams(location.hash.slice(1));
const CID=P.get('cid')||'',WS=P.get('ws')||'',PW=(P.get('pw')||'').trim(),SCENE=P.get('scene')||'Ingest',TXT=P.get('txt')||'',PRE=P.get('pre')||'[Musiques] ';
const DEBUG=P.has('debug');
const MAP={};(P.get('m')||'').split(',').filter(Boolean).forEach(x=>{const i=x.lastIndexOf(':');if(i>0)MAP[x.slice(0,i)]=x.slice(i+1).padStart(2,'0')});
const N=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim();
const BASE=s=>N(String(s).replace(/\s+-\s+.*$/,'').replace(/\(.*?\)|\[.*?\]/g,''));
let TT={};try{TT=JSON.parse(P.get('tt')||'{}')}catch(e){}
function nnFor(it){
  if(!it)return null;
  if(MAP[it.id])return MAP[it.id];
  if(it.linked_from&&MAP[it.linked_from.id])return MAP[it.linked_from.id];
  const n=it.name||'';return TT[N(n)]||TT[BASE(n)]||null;
}
const RT0=P.get('rt')||'';
let rt=RT0;try{rt=localStorage.getItem('exit-rt:'+RT0.slice(-16))||RT0}catch(e){}
let at=null,atExp=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LOGS=[];
function log(t){console.log('[Pilote EXIT]',t);LOGS.unshift(new Date().toLocaleTimeString('fr-FR')+' · '+t);LOGS.length=Math.min(LOGS.length,8);if(DEBUG){const s=document.getElementById('s');s.style.display='block';s.textContent=new Date().toLocaleTimeString('fr-FR')+' · '+t}}

/* ---------- SHA-256 (auth obs-websocket) ---------- */
function sha256(bytes){
  const K=[],H=[];let n=2,c=0;const frac=x=>(x-Math.floor(x))*4294967296|0;
  while(c<64){let p=true;for(let f=2;f*f<=n;f++)if(n%f===0){p=false;break}
    if(p){if(c<8)H[c]=frac(Math.pow(n,1/2));K[c]=frac(Math.pow(n,1/3));c++}n++}
  const l=bytes.length,bl=((l+9+63)>>6)<<6,m=new Uint8Array(bl);m.set(bytes);m[l]=0x80;
  const bits=l*8;m[bl-4]=bits>>>24;m[bl-3]=bits>>>16;m[bl-2]=bits>>>8;m[bl-1]=bits;m[bl-8]=Math.floor(bits/4294967296)>>>0;
  const w=new Array(64),r=(x,y)=>(x>>>y)|(x<<(32-y));
  for(let o=0;o<bl;o+=64){
    for(let i=0;i<16;i++)w[i]=(m[o+i*4]<<24)|(m[o+i*4+1]<<16)|(m[o+i*4+2]<<8)|m[o+i*4+3];
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(b,17)^r(b,19)^(b>>>10)))|0}
    let[a,b,c2,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0;const t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c2)^(b&c2)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b;b=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c2)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  const out=new Uint8Array(32);H.forEach((v,i)=>{out[i*4]=v>>>24;out[i*4+1]=v>>>16;out[i*4+2]=v>>>8;out[i*4+3]=v});return out}
const b64sha=s=>btoa(String.fromCharCode(...sha256(new TextEncoder().encode(s))));

/* ---------- obs-websocket v5 ---------- */
const O={ws:null,ok:false,id:0,pend:new Map(),retry:0,urls:[]};
O.urls=[WS,'ws://127.0.0.1:4455','ws://localhost:4455'].filter((u,i,a)=>u&&a.indexOf(u)===i);
let urlIdx=0;
function connect(){
  const url=O.urls[urlIdx%O.urls.length];let ws;
  try{ws=new WebSocket(url)}catch(e){urlIdx++;setTimeout(connect,2000);return}
  O.ws=ws;
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}const d=m.d||{};
    if(m.op===0){const id={rpcVersion:1,eventSubscriptions:1|4|128};
      if(d.authentication)id.authentication=b64sha(b64sha(PW+d.authentication.salt)+d.authentication.challenge);
      ws.send(JSON.stringify({op:1,d:id}))}
    else if(m.op===2){O.ok=true;O.everOk=true;O.retry=0;log('OBS connecté ('+url+')');loadItems();status(true)}
    else if(m.op===7){const p=O.pend.get(d.requestId);if(p){O.pend.delete(d.requestId);d.requestStatus.result?p.res(d.responseData||{}):p.rej(new Error(d.requestStatus.comment||('code '+d.requestStatus.code)))}}
    else if(m.op===5){const t=d.eventType,e=d.eventData||{};if(/^SceneItem(Created|Removed|ListReindexed)$|^InputNameChanged$/.test(t))loadItems();
      if(t==='SceneItemEnableStateChanged'&&e.sceneName===SCENE){const it=ITEMS.find(i=>i.sceneItemId===e.sceneItemId);if(it)it.sceneItemEnabled=e.sceneItemEnabled}}
  };
  ws.onclose=ev=>{if(ws!==O.ws)return;O.ok=false;O.pend.forEach(p=>p.rej(new Error('fermé')));O.pend.clear();
    if(ev.code===4009)log('Mot de passe OBS refusé');
    if(!O.everOk)urlIdx++;
    setTimeout(connect,Math.min(10000,1000*Math.pow(1.5,O.retry++)))};
}
function req(type,data){return new Promise((res,rej)=>{if(!O.ok)return rej(new Error('OBS non connecté'));const id='p'+(++O.id);O.pend.set(id,{res,rej});
  O.ws.send(JSON.stringify({op:6,d:{requestType:type,requestId:id,requestData:data||{}}}));setTimeout(()=>{if(O.pend.has(id)){O.pend.delete(id);rej(new Error('délai'))}},6000)})}

/* ---------- Sources de la scène SONS ---------- */
let ITEMS=[];
async function loadItems(){try{ITEMS=(await req('GetSceneItemList',{sceneName:SCENE})).sceneItems||[]}catch(e){log('Scène '+SCENE+' introuvable')}}
const itemOf=nn=>ITEMS.find(i=>i.sourceName.startsWith(PRE+nn+' ')||i.sourceName===PRE+nn);

/* ---------- Spotify ---------- */
async function refresh(){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'refresh_token',refresh_token:rt,client_id:CID})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error('Spotify : '+(j.error_description||j.error||r.status));
  at=j.access_token;atExp=Date.now()+((j.expires_in||3600)-60)*1000;
  if(j.refresh_token&&j.refresh_token!==rt){rt=j.refresh_token;try{localStorage.setItem('exit-rt:'+RT0.slice(-16),rt)}catch(e){}}
}
async function player(){
  if(!at||Date.now()>atExp)await refresh();
  const t0=Date.now();
  let r=await fetch('https://api.spotify.com/v1/me/player?additional_types=track',{headers:{Authorization:'Bearer '+at},cache:'no-store'});
  if(r.status===401){await refresh();r=await fetch('https://api.spotify.com/v1/me/player?additional_types=track',{headers:{Authorization:'Bearer '+at},cache:'no-store'})}
  if(r.status===429){const w=(+r.headers.get('Retry-After')||3)*1000;await sleep(w);return null}
  if(r.status===204)return{is_playing:false,_lat:(Date.now()-t0)/2};
  if(!r.ok)throw new Error('Spotify HTTP '+r.status);
  const j=await r.json();j._lat=(Date.now()-t0)/2;return j;
}

/* ---------- Pilotage ---------- */
const ST={shown:null,paused:false,track:'',title:'',artist:'',playing:false,lastDrift:0,err:'',lastText:'',showAt:0,override:'',lastProg:0,lastProgAt:0};
const FADE='_Fondu EXIT',FADE_MS=500,FADE_STEPS=8;const FADING=new Set();
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
async function media(it,action){await req('TriggerMediaInputAction',{inputName:it.sourceName,mediaAction:'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_'+action})}
async function seek(it,ms){if(ms>800)await req('SetMediaInputCursor',{inputName:it.sourceName,mediaCursor:Math.round(ms)})}
async function setEn(it,v){await req('SetSceneItemEnabled',{sceneName:SCENE,sceneItemId:it.sceneItemId,sceneItemEnabled:v});it.sceneItemEnabled=v}
async function hasFade(src){try{await req('GetSourceFilter',{sourceName:src,filterName:FADE});return true}catch(e){}
  try{await req('CreateSourceFilter',{sourceName:src,filterName:FADE,filterKind:'color_filter_v2',filterSettings:{opacity:1}});return true}catch(e){return false}}
async function prep(it){
  // ne remet le volume que si un fondu précédent a été interrompu (volume ~0) : sinon on garde le réglage de la Régie
  let cur=1;try{cur=(await req('GetInputVolume',{inputName:it.sourceName})).inputVolumeMul}catch(e){}
  const o=ls('exit-vol:'+it.sourceName);if(cur<0.01&&o!=null&&+o>0.001){try{await req('SetInputVolume',{inputName:it.sourceName,inputVolumeMul:+o})}catch(e){}}
  try{await req('SetSourceFilterSettings',{sourceName:it.sourceName,filterName:FADE,filterSettings:{opacity:1},overlay:true})}catch(e){}
}
async function fadeOut(it){
  if(FADING.has(it.sourceName))return;FADING.add(it.sourceName);try{
  let orig=1;try{orig=(await req('GetInputVolume',{inputName:it.sourceName})).inputVolumeMul}catch(e){}
  const saved=ls('exit-vol:'+it.sourceName);if(saved==null||orig>0.001)ls('exit-vol:'+it.sourceName,String(orig));orig=+(ls('exit-vol:'+it.sourceName)||1);
  const f=await hasFade(it.sourceName);
  for(let i=1;i<=FADE_STEPS;i++){const p=i/FADE_STEPS;
    await Promise.all([req('SetInputVolume',{inputName:it.sourceName,inputVolumeMul:orig*Math.pow(1-p,2)}).catch(()=>{}),
      f?req('SetSourceFilterSettings',{sourceName:it.sourceName,filterName:FADE,filterSettings:{opacity:1-p},overlay:true}).catch(()=>{}):0]);
    await sleep(FADE_MS/FADE_STEPS)}
  try{await media(it,'STOP')}catch(e){}
  try{await setEn(it,false)}catch(e){}
  try{await req('SetInputVolume',{inputName:it.sourceName,inputVolumeMul:orig})}catch(e){}
  if(f)try{await req('SetSourceFilterSettings',{sourceName:it.sourceName,filterName:FADE,filterSettings:{opacity:1},overlay:true})}catch(e){}
  }finally{FADING.delete(it.sourceName)}
}
async function show(nn,prog){
  const it=itemOf(nn);if(!it)throw new Error('Source '+PRE+nn+' absente de '+SCENE);
  // une autre musique encore affichée (lancée à la main) : on la fait sortir en fondu
  ITEMS.filter(o=>o!==it&&o.sceneItemEnabled&&o.sourceName.startsWith(PRE)).forEach(o=>fadeOut(o));
  if(FADING.has(it.sourceName))await sleep(FADE_MS+150);
  await prep(it);await setEn(it,true);await media(it,'RESTART');await sleep(150);await seek(it,prog+150);
  ST.shown=nn;ST.paused=false;ST.lastDrift=Date.now();ST.showAt=Date.now();ST.lastProg=prog;ST.lastProgAt=Date.now();log('▶ '+nn+' '+ST.title);
}
async function resume(nn,prog){const it=itemOf(nn);if(!it)return;await prep(it);await setEn(it,true);await media(it,'PLAY');await seek(it,prog);ST.paused=false;ST.lastDrift=Date.now();ST.showAt=Date.now();ST.lastProg=prog;ST.lastProgAt=Date.now();log('▶ reprise '+nn)}
async function drift(nn,prog){
  if(Date.now()-ST.lastDrift<2500)return;ST.lastDrift=Date.now();
  const it=itemOf(nn);if(!it||!it.sceneItemEnabled)return;
  try{const s=await req('GetMediaInputStatus',{inputName:it.sourceName});
    if(typeof s.mediaCursor==='number'&&Math.abs(s.mediaCursor-prog)>1200&&prog<(s.mediaDuration||1e12)-1500){await seek(it,prog);log('↻ recalage '+nn)}
  }catch(e){}
}
async function setText(){
  if(!TXT||!ST.title)return;const t=ST.title+(ST.artist?' — '+ST.artist:'');if(t===ST.lastText)return;
  try{await req('SetInputSettings',{inputName:TXT,inputSettings:{text:t},overlay:true});ST.lastText=t}catch(e){}
}
async function step(){
  const p=await player();if(!p)return;
  const it=p.item||{},tid=it.id||'',nn=nnFor(it),playing=!!p.is_playing;
  const prog=(p.progress_ms||0)+(p._lat||0);ST.lastNn=nn;
  if(tid&&tid!==ST.track)log((nn?'Spotify : '+(it.name||'?')+' → musique '+nn:'Spotify : '+(it.name||'?')+' (pas dans la liste)'));
  if(tid!==ST.track)ST.override='';
  ST.playing=playing;ST.track=tid;ST.title=it.name||'';ST.artist=(it.artists||[]).map(a=>a.name).join(', ');
  if(!O.ok)return;
  if(!playing)ST.override='';
  if(playing&&nn){
    if(ST.override===tid)return;                                  // arrêtée à la main : on n'insiste pas
    const cur=itemOf(nn);
    if(ST.shown===nn&&!ST.paused&&cur&&!cur.sceneItemEnabled&&Date.now()-ST.showAt>2500){ST.override=tid;ST.shown=null;log('Arrêt manuel respecté');return}
    if(ST.shown!==nn){await show(nn,prog)}
    else if(ST.paused)await resume(nn,prog);
    else{
      // saut dans le morceau (ex. 0:45 → 2:14) : on recale l'asset immédiatement
      const now=Date.now(),exp=ST.lastProgAt?ST.lastProg+(now-ST.lastProgAt):prog;
      if(ST.lastProgAt&&Math.abs(prog-exp)>1500){const it2=itemOf(nn);if(it2&&it2.sceneItemEnabled){await seek(it2,prog+100);ST.lastDrift=now;log('⤳ saut à '+Math.floor(prog/60000)+':'+String(Math.floor(prog/1000)%60).padStart(2,'0'))}}
      else await drift(nn,prog);
    }
    ST.lastProg=prog;ST.lastProgAt=Date.now();
    await setText();
  }else if(ST.shown){
    const cur=itemOf(ST.shown);
    if(!nn){if(cur&&cur.sceneItemEnabled)await fadeOut(cur);ST.shown=null;ST.paused=false;log('Morceau hors liste : musique sortie')}
    else if(!ST.paused){if(cur&&cur.sceneItemEnabled)await fadeOut(cur);ST.paused=true;log('⏸ '+ST.shown)}
  }
}
let lastSig='',lastSent=0;
async function status(force){
  if(!O.ok)return;
  const st={regieExit:'pilote',v:2,playing:ST.playing,title:ST.title,artist:ST.artist,track:ST.track,nn:ST.shown,paused:ST.paused,mapped:!!ST.lastNn,tracks:Object.keys(MAP).length,err:ST.err,logs:LOGS.slice(0,6),ts:Date.now()};
  const sig=JSON.stringify([st.playing,st.title,st.nn,st.paused,st.err]);
  if(!force&&sig===lastSig&&Date.now()-lastSent<4000)return;
  lastSig=sig;lastSent=Date.now();
  try{await req('SetPersistentData',{realm:'OBS_WEBSOCKET_DATA_REALM_GLOBAL',slotName:'exitPilote',slotValue:st})}catch(e){}
  try{await req('BroadcastCustomEvent',{eventData:st})}catch(e){}
}
async function main(){
  if(!CID||!RT0){log('Configuration incomplète : réinstalle le pilote depuis la Régie');return}
  connect();
  for(;;){
    try{await step();ST.err=''}catch(e){ST.err=e.message;log(e.message);await sleep(2000)}
    status(false);
    await sleep(1000);
  }
}
main();
</script>
</body>
</html>
